name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify TypeScript workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Codecov OIDC upload, no stored token
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run test:coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
          fail_ci_if_error: false
      - run: npm run build

  container-build:
    name: Verify ${{ matrix.component }} container build
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: infra/docker/Dockerfile.api
          - component: worker
            dockerfile: infra/docker/Dockerfile.worker
          - component: web
            dockerfile: infra/docker/Dockerfile.web
          - component: migrate
            dockerfile: infra/docker/Dockerfile.migrate
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-config:
    name: Validate Compose configuration
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      POSTGRES_PASSWORD: ci-only-password
      MUSEARR_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      MUSEARR_SESSION_SECRET: ci-only-session-secret
      MUSEARR_IMAGE_VERSION: ci-validation
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.release.yml config --quiet
