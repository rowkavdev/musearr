services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: musearr
      POSTGRES_USER: musearr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-musearr}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musearr -d musearr"]
      interval: 5s
      timeout: 5s
      retries: 15
    networks: [app]

  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.migrate
    environment:
      DATABASE_URL: postgresql://musearr:${POSTGRES_PASSWORD:-musearr}@db:5432/musearr
    depends_on:
      db:
        condition: service_healthy
    networks: [app]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://musearr:${POSTGRES_PASSWORD:-musearr}@db:5432/musearr
      MUSEARR_API_HOST: 0.0.0.0
      MUSEARR_API_PORT: 4000
      MUSEARR_WEB_ORIGIN: ${MUSEARR_WEB_ORIGIN:-http://localhost}
      MUSEARR_TRUST_PROXY: "true"
      MUSEARR_ENCRYPTION_KEY: ${MUSEARR_ENCRYPTION_KEY:?Set MUSEARR_ENCRYPTION_KEY in .env}
      MUSEARR_SESSION_SECRET: ${MUSEARR_SESSION_SECRET:?Set MUSEARR_SESSION_SECRET in .env}
      MUSEARR_PLEX_WEBHOOK_SECRET: ${MUSEARR_PLEX_WEBHOOK_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [app]

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://musearr:${POSTGRES_PASSWORD:-musearr}@db:5432/musearr
      MUSEARR_ENCRYPTION_KEY: ${MUSEARR_ENCRYPTION_KEY:?Set MUSEARR_ENCRYPTION_KEY in .env}
      MUSEARR_RECONCILIATION_INTERVAL_MINUTES: ${MUSEARR_RECONCILIATION_INTERVAL_MINUTES:-360}
      MUSEARR_TIMEZONE: ${MUSEARR_TIMEZONE:-UTC}
      MUSEARR_DAILY_BRIEF_TIME: ${MUSEARR_DAILY_BRIEF_TIME:-08:00}
      MUSEARR_DISCORD_WEBHOOK_URL: ${MUSEARR_DISCORD_WEBHOOK_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [app]

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        MUSEARR_API_URL: http://api:4000
    restart: unless-stopped
    environment:
      MUSEARR_API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    networks: [app, edge]

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "${MUSEARR_PORT:-80}:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [edge]

networks:
  app:
    internal: true
  edge:

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
